                {
                    day: 5, dateLabel: "2026.10.08 Thu", navDate: "10/8", weekday: "Thu", title: "沖繩本島觀光與歸途", location: "那霸市 → 台灣",
                    weather: { high: "29°C", low: "24°C", desc: "晴朗", rain: "0%" },
                    events: [
                        { type: "food", tag: "Lunch", title: "早午餐", isList: true, options: [
                            { name: "時髦沖繩麵 EIBUN", url: "https://sobaeibun.okinawa/" },
                            { name: "咖啡輕食 HUU'S COFFEE", url: "https://www.instagram.com/huus_coffee/" },
                            { name: "水果漢堡 LITOR", url: "https://www.instagram.com/litor_okinawa/" }
                        ], emoji: "🍜" },
                        { type: "sightseeing", tag: "Sightseeing", title: "建築探訪", isList: true, options: [
                            { name: "名護市役所", url: "https://maps.app.goo.gl/yMbJavVdbqo3VUfx8" },
                            { name: "市民會館", url: "https://maps.app.goo.gl/RY9QyH2wRpQkHDd89" },
                            { name: "沖繩縣立博物館・美術館", url: "https://maps.app.goo.gl/NQ2xvBmES4mbqppw6" },
                            { name: "那覇市役所", url: "https://maps.app.goo.gl/AoGkDVSjms1hfQM56" }
                        ], emoji: "🏛️" },
                        { type: "sightseeing", tag: "Sightseeing", title: "沖繩本島最後漫遊", desc: "國際通最後採買伴手禮", emoji: "🛍️" },
                        { type: "transport", tag: "Transport", time: "17:00", title: "還車", desc: "回飯店拿行李", emoji: "🚗" },
                        { type: "transport", tag: "Transport", time: "17:30", title: "前往機場", desc: "搭乘輕軌或計程車前往那霸機場（約15分鐘）", emoji: "🚕" },
                        { type: "flight", title: "搭機返台", flightInfo: { from: "OKA 那霸", to: "RMQ 台中", depTime: "20:10", arrTime: "20:50", toTerminal: "Terminal 2", flightNo: "JX313" }, emoji: "✈️" },
                        { type: "flight", title: "林董夫妻搭機返台", flightInfo: { from: "OKA 那霸", to: "TPE 台北", depTime: "20:20", arrTime: "20:55", toTerminal: "Terminal 2", flightNo: "BR185" }, emoji: "✈️" }
                    ]
                }
            ];

            const getInitialDay = () => {
                const tripDates = ["2026-10-04", "2026-10-05", "2026-10-06", "2026-10-07", "2026-10-08"];
                const today = new Date();
                const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
                const matchIndex = tripDates.indexOf(todayStr);
                if (matchIndex !== -1) return matchIndex + 1;
                if (todayStr > tripDates[tripDates.length - 1]) return tripDates.length;
                return 0;
            };

            const [activeDay, setActiveDay] = useState(getInitialDay);
            const currentDayData = schedule[activeDay] || schedule[0]; 

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [activeDay]);

            return (
                <div className="min-h-screen bg-slate-200 sm:py-8">
                <div className="max-w-md mx-auto min-h-screen sm:min-h-0 pb-12 text-left bg-gradient-to-b from-sky-100/50 via-sky-50 to-white sm:rounded-3xl sm:shadow-2xl sm:overflow-hidden">
                    {}
                    <div className="relative h-[220px] w-full overflow-hidden shadow-md">
                        <img src={headerImageUrl} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-t from-sky-950/80 via-sky-900/30 to-transparent" />
                        <div className="absolute inset-x-0 bottom-0 p-6">
                            <div>
                                <p className="text-white/90 text-xs font-bold tracking-widest mb-1 drop-shadow-sm">2026・秋 宮古島 & 沖繩</p>
                                <h1 className="font-bubble font-extrabold text-4xl text-white tracking-wide drop-shadow-md">Let's go to MIYAKO</h1>
                            </div>
                        </div>
                    </div>

                    {}
                    <div className="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-sky-100 shadow-sm">
                        <div className="overflow-x-auto no-scrollbar py-3 px-4 flex gap-2.5">
                            {schedule.map((day, index) => (
                                <button key={index} onClick={() => setActiveDay(index)} className={`flex flex-col items-center justify-center min-w-[62px] px-2 h-16 rounded-2xl transition-all shadow-sm ${activeDay === index ? 'bg-sky-500 text-white shadow-sky-300 scale-105' : 'bg-white text-slate-500 border border-sky-100 hover:bg-sky-50'}`}>
                                    <span className="text-[9px] font-black uppercase tracking-wider">{day.navDate === 'Notice' ? '須知' : `D${day.day}`}</span>
                                    <span className="text-xs font-black mt-0.5 whitespace-nowrap">{day.navDate === 'Notice' ? '📌' : day.navDate}</span>
                                    {day.weekday && <span className={`text-[9px] font-bold mt-0.5 ${activeDay === index ? 'text-white/80' : 'text-slate-400'}`}>{day.weekday}</span>}
                                </button>
                            ))}
                        </div>
                    </div>

                    {}
                    <main className="px-5 mt-6">
                        <div className="mb-6 animate-fade-in">
                            <div className="flex items-center gap-2 mb-1">
                                <div className="h-1.5 w-6 bg-sky-500 rounded-full" />
                                <span className="text-sky-600 font-black text-xs uppercase tracking-widest">{currentDayData.location}</span>
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 tracking-tight leading-snug">{currentDayData.title}</h2>
                            <p className="text-sky-700 font-bold text-xs mt-1">{currentDayData.dateLabel}</p>
                        </div>

                        {}
                        {currentDayData.day !== 0 && (
                        <div className="mb-6 animate-fade-in">
                            <div className="bg-white/80 backdrop-blur-md border border-sky-100 rounded-2xl p-4 shadow-sm">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-sky-500 rounded-xl text-white shadow-sm"><Icon name="cloud-sun" size={18} /></div>
                                        <div>
                                            <h4 className="text-xs font-black text-slate-800 uppercase tracking-wider">{currentDayData.weather.desc}</h4>
                                            <p className="text-[10px] font-bold text-slate-400">降雨機率 {currentDayData.weather.rain}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="flex items-baseline gap-1">
                                            <span className="text-xl font-black text-amber-500 tracking-tighter">{currentDayData.weather.high}</span>
                                            <span className="text-slate-300 font-black mx-0.5">/</span>
                                            <span className="text-base font-bold text-sky-600 tracking-tighter">{currentDayData.weather.low}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        )}

                        {}
                        <div className="space-y-4 relative">
                            <div className="absolute top-8 bottom-0 left-[21px] w-[2px] bg-sky-200" />
                            {currentDayData.events.map((event, idx) => {
                                const style = getTagStyle(event.tag);
                                const isSpecialTime = event.title.includes('★') || event.highlightTime;
                                
                                return (
                                    <div key={`${activeDay}-${idx}`} className="relative pl-12 animate-slide-up" style={{ animationDelay: `${idx * 40}ms` }}>
                                        <div className="absolute left-0 top-0 flex flex-col items-center">
                                            <div className="w-11 h-11 rounded-2xl bg-white border-2 border-sky-100 shadow-sm flex items-center justify-center text-xl z-10">{event.emoji}</div>
                                            {event.time && (
                                                <div className={`mt-1.5 px-1.5 py-0.5 rounded-md text-white font-black text-[9px] tracking-tight ${isSpecialTime ? 'bg-rose-500 shadow-sm' : 'bg-slate-800'}`}>
                                                    {event.time}
                                                </div>
                                            )}
                                        </div>
                                        <div className={`bg-white rounded-2xl p-4 shadow-sm border ${style.border} ${isSpecialTime ? 'ring-2 ring-rose-200 shadow-md' : ''}`}>
                                            {event.tag && <div className={`inline-flex items-center gap-1 mb-1.5 px-2 py-0.5 rounded-full ${style.bg} ${style.text}`}><Icon name={style.icon} size={10} strokeWidth={3} /><span className="text-[9px] font-black uppercase tracking-wider">{event.tag}</span></div>}
                                            <div className="flex justify-between items-start gap-2">
                                                <h3 className="font-black text-slate-800 text-base leading-tight flex-1">
                                                    {event.title}
                                                </h3>
                                                {event.location && <button onClick={() => openMap(event.location)} className={`w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${style.btn}`}><Icon name="navigation" size={16} fill="currentColor" /></button>}
                                            </div>

                                            {event.desc && <p className="text-slate-600 text-xs mt-2 font-medium leading-relaxed whitespace-pre-line">{event.desc}</p>}

                                            {event.type === 'flight' && event.flightInfo && (
                                                <div className="mt-3 bg-sky-50/50 rounded-xl p-3 border border-sky-100">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <div className="text-center">
                                                            <div className="text-base font-black text-slate-800 tracking-tighter">{event.flightInfo.from.split(' ')[1]}</div>
                                                            <div className="text-[10px] font-bold text-slate-400">{event.flightInfo.from.split(' ')[0]}</div>
                                                            {event.flightInfo.fromTerminal && <div className="text-[9px] font-bold text-sky-500 mt-0.5">{event.flightInfo.fromTerminal}</div>}
                                                        </div>
                                                        <div className="flex flex-col items-center grow px-4">
                                                            <div className="text-[10px] font-black text-sky-600 mb-1">{event.flightInfo.flightNo || '航班資訊'}</div>
                                                            <div className="w-full h-[1.5px] bg-sky-200 relative">
                                                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-sky-50 px-2">
                                                                    <Icon name="plane" size={12} className="text-sky-400 rotate-90" fill="currentColor" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="text-center">
                                                            <div className="text-base font-black text-slate-800 tracking-tighter">{event.flightInfo.to.split(' ')[1]}</div>
                                                            <div className="text-[10px] font-bold text-slate-400">{event.flightInfo.to.split(' ')[0]}</div>
                                                            {event.flightInfo.toTerminal && <div className="text-[9px] font-bold text-sky-500 mt-0.5">{event.flightInfo.toTerminal}</div>}
                                                        </div>
                                                    </div>
                                                    <div className="flex justify-between pt-2 border-t border-sky-100 text-[10px] font-bold text-slate-500">
                                                        <span>起飛 {event.flightInfo.depTime}</span>
                                                        <span>抵達 {event.flightInfo.arrTime}</span>
                                                    </div>
                                                </div>
                                            )}

                                            {event.transitInfo && (
                                                <div className="mt-3 bg-slate-50 rounded-xl p-3 border border-slate-200">
                                                    <div className="flex justify-between items-center">
                                                        <div className="text-center">
                                                            <div className="text-sm font-black text-slate-800 leading-snug">{event.transitInfo.from}</div>
                                                        </div>
                                                        <div className="flex flex-col items-center grow px-3">
                                                            <div className="w-full h-[1.5px] bg-slate-300 relative">
                                                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-50 px-2">
                                                                    <Icon name="train-front" size={14} className="text-slate-400" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="text-center">
                                                            <div className="text-sm font-black text-slate-800 leading-snug">{event.transitInfo.to}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {event.isList && event.options && (
                                                <div className="mt-3 flex flex-col gap-2">
                                                    {event.options.map((opt, i) => {
                                                        const parsed = parseOptionName(opt.name);
                                                        const note = opt.desc || parsed.note;
                                                        return (
                                                            <button key={i} onClick={() => openMap(opt.url)} className={`flex items-center gap-3 p-3 rounded-xl border text-left transition-all ${style.bg} ${style.border} active:scale-[0.98]`}>
                                                                <div className="min-w-0 flex-1">
                                                                    <div className={`text-xs font-bold leading-snug ${style.text}`}>{parsed.title}</div>
                                                                    {note && <div className="text-[10px] font-medium text-slate-500 leading-snug mt-0.5">{note}</div>}
                                                                </div>
                                                                <Icon name="chevron-right" size={14} className={`shrink-0 ${style.text} opacity-60`} />
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            {event.footnote && (
                                                <p className="text-[10px] font-medium text-slate-400 leading-relaxed mt-2 whitespace-pre-line">{event.footnote}</p>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TripApp />);
    </script>
</body>
</html>
