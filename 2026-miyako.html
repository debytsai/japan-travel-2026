                        { type: "flight", title: "宮古島組返台", desc: "下地島機場還車", location: "https://maps.app.goo.gl/JWSu3qiSN9imzRz49", flightInfo: { from: "SHI 下地島", to: "RMQ 台中", depTime: "10:40", arrTime: "11:00", toTerminal: "Terminal 2", flightNo: "JX309" }, emoji: "🛫" },
                        { type: "flight", time: "10:00", title: "沖繩組退房與轉往那霸", desc: "10:00 check out，宮古機場還車，繼續轉往那霸", location: "https://maps.app.goo.gl/J2XWf2G5K3ojchCW9", flightInfo: { from: "MMY 宮古", to: "OKA 那霸", depTime: "12:10", arrTime: "13:00", flightNo: "JTA558" }, emoji: "✈️" },
                        { type: "transport", tag: "Transport", title: "前往飯店", desc: "搭乘輕軌（ゆいレール）", transitInfo: { from: "那覇空港駅", to: "美栄橋駅" }, emoji: "🚈" },
                        { type: "hotel", tag: "Accommodation", title: "HOTEL STRATA NAHA", desc: "D&J 訂 Tatami Twin ¥ 20,880，先寄放行李", location: "https://maps.app.goo.gl/AUxdsGFob63vfTkU8", emoji: "🏨" },
                        { type: "transport", tag: "Transport", time: "14:00", title: "美麗島租車國際通店取車", desc: "一天＋3 小時共 ¥ 14,880，開始本島觀光", location: "https://maps.app.goo.gl/y7iNVAjVkpTNYbfd9", emoji: "🚗" },
                        { type: "food", tag: "Lunch", title: "午餐", isList: true, options: [

                        ], emoji: "🌮" },
                        { type: "dessert", tag: "Dessert", title: "吃冰：神元商店", desc: "營業時間有限的漂亮日式刨冰店", location: "https://maps.app.goo.gl/3sEUpNBWmJKwcyAh6", emoji: "🍧" },
                        { type: "food", tag: "Coffee", title: "喝咖", isList: true, options: [
                            { name: "豆ポレポレ", url: "https://maps.app.goo.gl/JTy2UVKAiAePsSjr7" },

                        ], emoji: "☕" },
                        { type: "shopping", tag: "Shopping", title: "快樂採購：PARCO CITY", desc: "沖繩購物重點行程！買起來！", location: "https://maps.app.goo.gl/V2eQFz9JBoSdPeyR8", emoji: "🏬" },
                        { type: "food", tag: "Dinner", time: "19:30", title: "義大利菜 BACAR OKINAWA", desc: "沖繩最高分餐廳，義大利菜套餐", location: "https://maps.app.goo.gl/2326s2anzcKZUVbt7", emoji: "🍽️" },
                        { type: "food", tag: "Dinner", title: "酒吧：El Lequio", desc: "亞洲百大酒吧小酌一下", location: "https://maps.app.goo.gl/Gge9GRTS46NFiaUf7", emoji: "🍸" }
                    ]
                },
                {
                    day: 5, dateLabel: "2026.10.08 Thu", navDate: "10/8", weekday: "Thu", title: "沖繩本島觀光與歸途", location: "那霸市 → 台灣",
                    weather: { high: "29°C", low: "24°C", desc: "晴朗", rain: "0%" },
                    events: [
                        { type: "food", tag: "Lunch", title: "早午餐", isList: true, options: [
                            { name: "時髦沖繩麵 EIBUN Tsuboya", url: "https://maps.app.goo.gl/JDVhxhBNzjsSqjDs7" },
                            { name: "咖啡輕食 HUU'S COFFEE", url: "https://maps.app.goo.gl/86pdddBNPpH6tHn27" },
                            { name: "水果漢堡 LITOR", url: "https://maps.app.goo.gl/urYGdCi4YLmoVaJ86" }
                        ], emoji: "🍜" },
                        { type: "sightseeing", tag: "Sightseeing", title: "建築探訪", isList: true, options: [
                            { name: "名護市役所", url: "https://maps.app.goo.gl/yMbJavVdbqo3VUfx8" },
                            { name: "市民會館", url: "https://maps.app.goo.gl/RY9QyH2wRpQkHDd89" },
                            { name: "沖繩縣立博物館・美術館", url: "https://maps.app.goo.gl/NQ2xvBmES4mbqppw6" },
                            { name: "那覇市役所", url: "https://maps.app.goo.gl/AoGkDVSjms1hfQM56" }
                        ], emoji: "🏛️" },
                        { type: "sightseeing", tag: "Sightseeing", title: "沖繩本島最後漫遊", desc: "國際通最後採買伴手禮", emoji: "🛍️" },
                        { type: "transport", tag: "Transport", time: "17:00", title: "還車", desc: "回飯店拿行李", location: "https://maps.app.goo.gl/y7iNVAjVkpTNYbfd9", emoji: "🚗" },
                        { type: "transport", tag: "Transport", time: "17:30", title: "前往機場", desc: "搭乘輕軌或計程車前往那霸機場（約15分鐘）", emoji: "🚕" },
                        { type: "flight", title: "二花搭機返台", flightInfo: { from: "OKA 那霸", to: "RMQ 台中", depTime: "20:10", arrTime: "20:50", toTerminal: "Terminal 2", flightNo: "JX313" }, emoji: "✈️" },
                        { type: "flight", title: "台北組搭機返台", flightInfo: { from: "OKA 那霸", to: "TPE 台北", depTime: "20:20", arrTime: "20:55", toTerminal: "Terminal 2", flightNo: "BR185" }, emoji: "✈️" }
                    ]
                }
            ];

            const getInitialDay = () => {
                const tripDates = ["2026-10-04", "2026-10-05", "2026-10-06", "2026-10-07", "2026-10-08"];
                const today = new Date();
                const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
                const matchIndex = tripDates.indexOf(todayStr);
                if (matchIndex !== -1) return matchIndex + 1;
                if (todayStr > tripDates[tripDates.length - 1]) return tripDates.length;
                return 0;
            };

            const [activeDay, setActiveDay] = useState(getInitialDay);
            const currentDayData = schedule[activeDay] || schedule[0]; 

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [activeDay]);

            return (
                <div className="min-h-screen bg-[#DCD3BA] sm:py-8">
                <div className="max-w-md mx-auto min-h-screen sm:min-h-0 pb-12 text-left bg-[#F5EFE0] sm:shadow-2xl sm:overflow-hidden">
                    {}
                    <div className="relative h-[240px] w-full overflow-hidden">
                        <img src={headerImageUrl} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#232323]/85 via-[#232323]/15 to-transparent" />
                        <div className="absolute top-4 right-4 px-3 py-2 text-center">
                            <p className="font-kicker text-[9px] font-bold uppercase leading-none text-white">Issue</p>
                            <p className="font-bubble text-xl leading-none mt-1 text-white">2026</p>
                            <p className="font-kicker text-[9px] font-bold uppercase leading-none mt-1 text-white">Autumn</p>
                        </div>
                        <div className="absolute inset-x-0 bottom-0 p-6">
                            <p className="font-kicker text-[#E3A72E] text-xs font-bold uppercase mb-1">Miyakojima &amp; Okinawa</p>
                            <h1 className="font-bubble text-4xl text-white tracking-wide">Let's go to MIYAKO</h1>
                            <svg viewBox="0 0 220 14" className="w-[220px] h-[14px] mt-1">
                                <path d="M3 8C25 2 40 2 55 7C70 12 85 12 100 6C115 1 130 1 145 7C160 12 175 12 190 6C200 3 210 3 217 6" fill="none" stroke="#E3A72E" strokeWidth="3" strokeLinecap="round" />
                            </svg>
                        </div>
                    </div>

                    {}
                    <div className="sticky top-0 z-50 bg-[#F5EFE0]/95 backdrop-blur-xl border-b-2 border-[#232323]">
                        <div className="overflow-x-auto no-scrollbar py-3 px-4 flex gap-2">
                            {schedule.map((day, index) => {
                                const active = activeDay === index;
                                return (
                                <button key={index} onClick={() => setActiveDay(index)} className={`flex flex-col items-center justify-center min-w-[58px] px-2 h-16 rounded-2xl border-2 transition-all ${active ? 'bg-[#D3441F] border-[#D3441F] text-white scale-105 shadow-md' : 'bg-[#F5EFE0] border-[#232323]/20 text-[#232323] hover:border-[#232323]/50'}`}>
                                    <span className="font-kicker text-[9px] font-bold uppercase">{day.navDate === 'Notice' ? '須知' : `DAY ${day.day}`}</span>
                                    <span className="font-bubble text-sm font-bold mt-0.5 whitespace-nowrap">{day.navDate === 'Notice' ? '📌' : day.navDate}</span>
                                    {day.weekday && <span className={`font-kicker text-[9px] font-bold mt-0.5 ${active ? 'text-white/80' : 'text-[#232323]/40'}`}>{day.weekday}</span>}
                                </button>
                                );
                            })}
                        </div>
                    </div>

                    {}
                    <main className="px-5 mt-6">
                        <div className="mb-6 animate-fade-in">
                            <div className="flex items-center gap-2 mb-1.5">
                                <svg viewBox="0 0 34 10" className="w-[34px] h-[10px]">
                                    <path d="M2 6C7 2 11 2 14 5.5C17 9 21 9 24 5.5C27 2 30 2 32 4.5" fill="none" stroke="#D3441F" strokeWidth="2.5" strokeLinecap="round" />
                                </svg>
                                <span className="font-kicker text-[#D3441F] text-xs font-bold uppercase">{currentDayData.location}</span>
                            </div>
                            <h2 className="text-2xl font-black text-[#232323] leading-snug">{currentDayData.title}</h2>
                            <p className="font-kicker text-[#232323]/50 font-bold text-xs mt-1 uppercase">{currentDayData.dateLabel}</p>
                        </div>

                        {}
                        {currentDayData.day !== 0 && (
                        <div className="mb-6 animate-fade-in">
                            <div className="bg-[#DCEAE6] rounded-2xl p-4 border border-[#3D7A70]/15">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="relative p-2 bg-[#3D7A70] text-white" style={{ borderRadius: '62% 38% 45% 55% / 40% 55% 45% 60%' }}><Icon name="cloud-sun" size={18} /></div>
                                        <div>
                                            <h4 className="font-kicker text-xs font-bold text-[#232323] uppercase">{currentDayData.weather.desc}</h4>
                                            <p className="text-[10px] font-bold text-[#232323]/50">降雨機率 {currentDayData.weather.rain}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="flex items-baseline gap-1">
                                            <span className="font-kicker text-xl font-bold text-[#D3441F] tracking-tighter">{currentDayData.weather.high}</span>
                                            <span className="text-[#232323]/25 font-black mx-0.5">/</span>
                                            <span className="font-kicker text-base font-bold text-[#3D7A70] tracking-tighter">{currentDayData.weather.low}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        )}

                        {}
                        <div className="space-y-4 relative">
                            <div className="absolute top-8 bottom-0 left-[21px] w-0 border-l-2 border-dashed border-[#C9BFA4]" />
                            {currentDayData.events.map((event, idx) => {
                                const style = getTagStyle(event.tag);
                                const isSpecialTime = event.title.includes('★') || event.highlightTime;
                                
                                return (
                                    <div key={`${activeDay}-${idx}`} className="relative pl-12 animate-slide-up" style={{ animationDelay: `${idx * 40}ms` }}>
                                        <div className="absolute left-0 top-0 flex flex-col items-center">
                                            <div className="w-11 h-11 rounded-full bg-[#FBF8F0] border-2 border-[#232323]/15 flex items-center justify-center text-xl z-10">{event.emoji}</div>
                                            {event.time && (
                                                <div className={`mt-1.5 px-1.5 py-0.5 rounded-md font-kicker text-white text-[10px] font-bold ${isSpecialTime ? 'bg-[#D3441F]' : 'bg-[#232323]'}`}>
                                                    {event.time}
                                                </div>
                                            )}
                                        </div>
                                        <div className={`bg-[#FBF8F0] rounded-2xl p-4 border ${style.border} ${isSpecialTime ? 'ring-1 ring-[#D3441F]/40' : ''}`}>
                                            {event.tag && <div className={`inline-flex items-center gap-1 mb-2 px-2 py-0.5 rounded-md ${style.chip}`}><Icon name={style.icon} size={10} strokeWidth={3} /><span className="font-kicker text-[10px] font-bold uppercase">{event.tag}</span></div>}
                                            <div className="flex justify-between items-start gap-2">
                                                <h3 className="font-black text-[#232323] text-base leading-tight flex-1">
                                                    {event.title}
                                                </h3>
                                                {event.location && <a href={event.location} target={isMobile ? '_self' : '_blank'} rel="noopener noreferrer" className={`w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${style.btn}`}><Icon name="navigation" size={16} fill="currentColor" /></a>}
                                            </div>

                                            {event.desc && <p className="text-[#232323]/70 text-xs mt-2 font-medium leading-relaxed whitespace-pre-line">{event.desc}</p>}

                                            {event.type === 'flight' && event.flightInfo && (
                                                <div className="mt-3 bg-[#232323]/[0.03] rounded-xl p-3 border border-[#232323]/10">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <div className="text-center">
                                                            <div className="font-kicker text-lg font-bold text-[#232323] tracking-tight">{event.flightInfo.from.split(' ')[1]}</div>
                                                            <div className="text-[10px] font-bold text-[#232323]/40">{event.flightInfo.from.split(' ')[0]}</div>
                                                            {event.flightInfo.fromTerminal && <div className="text-[9px] font-bold text-[#D3441F] mt-0.5">{event.flightInfo.fromTerminal}</div>}
                                                        </div>
                                                        <div className="flex flex-col items-center grow px-4">
                                                            <div className="font-kicker text-[10px] font-bold text-[#D3441F] mb-1">{event.flightInfo.flightNo || '航班資訊'}</div>
                                                            <div className="w-full h-[1px] bg-[#C9BFA4] relative">
                                                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#F5EFE0] px-2">
                                                                    <Icon name="plane" size={12} className="text-[#232323]/40 rotate-90" fill="currentColor" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="text-center">
                                                            <div className="font-kicker text-lg font-bold text-[#232323] tracking-tight">{event.flightInfo.to.split(' ')[1]}</div>
                                                            <div className="text-[10px] font-bold text-[#232323]/40">{event.flightInfo.to.split(' ')[0]}</div>
                                                            {event.flightInfo.toTerminal && <div className="text-[9px] font-bold text-[#D3441F] mt-0.5">{event.flightInfo.toTerminal}</div>}
                                                        </div>
                                                    </div>
                                                    <div className="flex justify-between pt-2 border-t border-[#232323]/10 text-[10px] font-bold text-[#232323]/50">
                                                        <span>起飛 {event.flightInfo.depTime}</span>
                                                        <span>抵達 {event.flightInfo.arrTime}</span>
                                                    </div>
                                                </div>
                                            )}

                                            {event.transitInfo && (
                                                <div className="mt-3 bg-[#232323]/[0.03] rounded-xl p-3 border border-[#232323]/10">
                                                    <div className="flex justify-between items-center">
                                                        <div className="text-center">
                                                            <div className="text-sm font-black text-[#232323] leading-snug">{event.transitInfo.from}</div>
                                                        </div>
                                                        <div className="flex flex-col items-center grow px-3">
                                                            <div className="w-full h-[1px] bg-[#C9BFA4] relative">
                                                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#F5EFE0] px-2">
                                                                    <Icon name="train-front" size={14} className="text-[#232323]/40" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="text-center">
                                                            <div className="text-sm font-black text-[#232323] leading-snug">{event.transitInfo.to}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {event.isList && event.options && (
                                                <div className="mt-3 flex flex-col gap-2">
                                                    {event.options.map((opt, i) => {
                                                        const parsed = parseOptionName(opt.name);
                                                        const note = opt.desc || parsed.note;
                                                        return (
                                                            <a key={i} href={opt.url} target={isMobile ? '_self' : '_blank'} rel="noopener noreferrer" className={`flex items-center gap-3 p-3 rounded-xl border text-left transition-all ${style.bg} ${style.border} active:scale-[0.98]`}>
                                                                <div className="min-w-0 flex-1">
                                                                    <div className={`text-xs font-bold leading-snug ${style.text}`}>{parsed.title}</div>
                                                                    {note && <div className="text-[10px] font-medium text-[#232323]/50 leading-snug mt-0.5">{note}</div>}
                                                                </div>
                                                                <Icon name="chevron-right" size={14} className={`shrink-0 ${style.text} opacity-60`} />
                                                            </a>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            {event.footnote && (
                                                <p className="text-[10px] font-medium text-[#232323]/40 leading-relaxed mt-2 whitespace-pre-line">{event.footnote}</p>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TripApp />);
    </script>
</body>
</html>
